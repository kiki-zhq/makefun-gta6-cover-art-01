<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">VC</span>
    <span class="brand-name">VICE COVER STUDIO</span>
    <span class="brand-sub">make your own GTA-style poster</span>
  </div>
  <div class="top-actions">
    <label class="upload-btn">+ Add photos
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="sampleBoulevard" class="ghost-btn" type="button">Sample: Boulevard</button>
    <button id="samplePier" class="ghost-btn" type="button">Sample: Pier</button>
  </div>
</header>

<main class="workspace">
  <section class="stage-col">
    <div class="canvas-wrap">
      <canvas id="stage" width="1080" height="1080" tabindex="0"
        aria-label="Cover preview. Drag a panel to pan it; arrow keys nudge the selected panel."></canvas>
      <div id="emptyHint" class="empty-hint">Drop a photo or pick a sample to start your cover</div>
    </div>
    <p class="tip">Tip: click a panel to select it, drag it to pan, use the sliders or arrow keys to fine-tune.</p>
  </section>

  <aside class="panel-col">
    <section class="group">
      <h2>Layout</h2>
      <div class="seg" id="layoutSeg" role="group" aria-label="Cover layout">
        <button type="button" data-layout="hero" class="seg-btn active">Hero + 2</button>
        <button type="button" data-layout="grid" class="seg-btn">4-panel grid</button>
        <button type="button" data-layout="bleed" class="seg-btn">Full-bleed</button>
      </div>
    </section>

    <section class="group">
      <h2>Colour grade</h2>
      <div class="seg" id="gradeSeg" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="seg-btn active">Vice Sunset</button>
        <button type="button" data-grade="neon" class="seg-btn">Neon Night</button>
        <button type="button" data-grade="gold" class="seg-btn">Gold Hour</button>
      </div>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <label class="field">Title
        <input id="titleInput" type="text" value="SUNSET HEIST" maxlength="24">
      </label>
      <label class="field">Subtitle
        <input id="subtitleInput" type="text" value="VICE CITY &bull; 2026" maxlength="40">
      </label>
    </section>

    <section class="group">
      <h2>Selected panel</h2>
      <div class="panel-pick" id="panelPick"></div>
      <label class="field">Zoom <span id="zoomVal" class="val">1.00&times;</span>
        <input id="zoomSlider" type="range" min="1" max="2.5" step="0.01" value="1">
      </label>
      <label class="field">Pan X <span id="panXVal" class="val">0</span>
        <input id="panXSlider" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label class="field">Pan Y <span id="panYVal" class="val">0</span>
        <input id="panYSlider" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <div class="photo-pick" id="photoPick"></div>
    </section>

    <section class="group">
      <h2>Export PNG</h2>
      <div class="export-row">
        <button type="button" class="export-btn" data-export="1080x1080">1080 &times; 1080</button>
        <button type="button" class="export-btn" data-export="1080x1350">1080 &times; 1350</button>
        <button type="button" class="export-btn" data-export="1920x1080">1920 &times; 1080</button>
      </div>
    </section>
  </aside>
</main>

<script type="module" src="./src/shots.js"></script>
</body>
</html>
